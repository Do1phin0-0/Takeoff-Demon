<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Takeoff-Demon — Takeoff</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; max-width: 980px; margin: 2rem auto; padding: 0 1rem; }
      h1 { margin-bottom: 0.25rem; }
      .hint { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
      .steps { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
      .step { padding: 0.4rem 0.8rem; border-radius: 999px; border: 1px solid #888; font-size: 0.85rem; }
      .step.active { background: #222; color: #fff; border-color: #222; }
      .step.done { border-color: #1a7f37; color: #1a7f37; }
      #canvasWrap { position: relative; border: 1px solid #888; border-radius: 6px; overflow: auto; max-height: 70vh; }
      canvas { display: block; cursor: crosshair; }
      .controls { display: flex; gap: 0.6rem; align-items: center; margin: 0.8rem 0; flex-wrap: wrap; }
      button { padding: 0.5rem 0.9rem; font-size: 0.95rem; cursor: pointer; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
      button.secondary { background: transparent; color: inherit; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      input, select { padding: 0.4rem; border-radius: 4px; border: 1px solid #888; }
      #result { margin-top: 1rem; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.85rem; padding: 0.8rem; border-radius: 6px; }
      .ok { background: rgba(26,127,55,0.1); }
      .warn { background: rgba(200,150,0,0.12); }
      .err { background: rgba(185,28,28,0.1); }
      .confidence-medium { color: #a86a00; font-weight: 600; }
      .confidence-low { color: #b91c1c; font-weight: 600; }
      .confidence-invalid { color: #b91c1c; font-weight: 600; }
      dialog { border-radius: 8px; border: 1px solid #888; padding: 1rem; }
    </style>
  </head>
  <body>
    <h1>Takeoff</h1>
    <p class="hint" style="margin-bottom:0.5rem"><a href="/index.html">← Upload</a> · <a href="/takeoffs.html">Review takeoffs →</a></p>
    <p class="hint" id="fileLabel">Loading file…</p>

    <div class="controls" id="pageControls" style="display:none">
      <button class="secondary" id="prevPage">◀ Prev</button>
      <span id="pageLabel"></span>
      <input type="number" id="pageInput" min="1" style="width:5rem" />
      <button class="secondary" id="goPage">Go to page</button>
      <button class="secondary" id="nextPage">Next ▶</button>
      <span class="hint" style="margin:0">Changing pages resets calibration — scale is per sheet.</span>
    </div>

    <div class="steps">
      <span class="step" id="step1">1. Calibrate scale</span>
      <span class="step" id="step2">2. Trace boundary</span>
      <span class="step" id="step3">3. Save</span>
    </div>

    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls" id="calibrateControls" style="display:none">
      <span>Click two points on a known dimension, then enter its real length:</span>
      <input type="number" id="realDistance" placeholder="length" min="0" step="0.01" style="width:6rem" />
      <select id="realUnit"><option value="ft">ft</option><option value="in">in</option></select>
      <button id="confirmCalibration" disabled>Confirm calibration</button>
      <button class="secondary" id="resetCalibration">Reset</button>
    </div>

    <div class="controls" id="traceControls" style="display:none">
      <span id="traceHint">Click points around the room boundary, then close the shape.</span>
      <button id="closeShape" disabled>Close shape</button>
      <button class="secondary" id="undoPoint" disabled>Undo point</button>
      <button class="secondary" id="resetTrace">Reset</button>
    </div>

    <div class="controls" id="startTraceControls" style="display:none">
      <button id="startTrace">Start tracing boundary</button>
    </div>

    <div class="controls" id="saveControls" style="display:none">
      <span id="areaSummary"></span>
      <input type="text" id="note" placeholder="optional note" style="flex:1;min-width:12rem" />
      <button id="saveTakeoff">Save takeoff</button>
    </div>

    <div id="result"></div>

    <script type="module">
      import * as pdfjsLib from "/vendor/pdfjs/pdf.min.mjs";

      const params = new URLSearchParams(location.search);
      const fileName = params.get("file");
      const fileLabel = document.getElementById("fileLabel");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const resultEl = document.getElementById("result");

      let sourceImage = null; // drawn once, everything else overlays on redraw
      let mode = "idle"; // idle | calibrating | tracing | done
      let calibrationPoints = [];
      let calibration = null; // {pixelDistance, realDistance, unit}
      let tracePoints = [];
      let closedPolygon = null;
      let pdfDoc = null;
      let currentPage = Math.max(1, parseInt(params.get("page"), 10) || 1);
      let totalPages = 1;

      function setResult(text, cls) {
        resultEl.textContent = text;
        resultEl.className = cls || "";
      }

      function fail(msg) {
        setResult(msg, "err");
      }

      if (!fileName) {
        fileLabel.textContent = "No file specified.";
        fail("Open this page from the upload page after uploading a file.");
      } else {
        fileLabel.textContent = `File: ${fileName}`;
        loadSource(fileName);
      }

      async function loadSource(name) {
        const ext = name.split(".").pop().toLowerCase();
        const url = `/uploads/${encodeURIComponent(name)}`;
        if (["dwg", "dxf"].includes(ext)) {
          fail("Preview isn't supported yet for DWG/DXF in V1 — upload a PDF or image to run a takeoff.");
          return;
        }
        if (ext === "pdf") {
          try {
            pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdfjs/pdf.worker.min.mjs";
            pdfDoc = await pdfjsLib.getDocument({ url }).promise;
            totalPages = pdfDoc.numPages;
            if (currentPage > totalPages) currentPage = 1;
            await renderPdfPage(currentPage);
            setupPageControls();
            afterSourceLoaded();
          } catch (e) {
            fail(`Could not render PDF: ${e.message}`);
          }
        } else {
          const img = new Image();
          img.onload = () => {
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            ctx.drawImage(img, 0, 0);
            sourceImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
            afterSourceLoaded();
          };
          img.onerror = () => fail("Could not load image.");
          img.src = url;
        }
      }

      async function renderPdfPage(pageNum) {
        const page = await pdfDoc.getPage(pageNum);
        const baseViewport = page.getViewport({ scale: 1 });
        // Target ~3600px wide so dimension text on Arch D/E sheets stays legible for clicking.
        const scale = Math.min(2.5, Math.max(1, 3600 / baseViewport.width));
        const viewport = page.getViewport({ scale });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: ctx, viewport }).promise;
        sourceImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
        fileLabel.textContent = `File: ${fileName} — page ${pageNum} of ${totalPages}`;
      }

      function setupPageControls() {
        if (totalPages <= 1) return;
        const controls = document.getElementById("pageControls");
        controls.style.display = "flex";
        const label = document.getElementById("pageLabel");
        const input = document.getElementById("pageInput");
        const update = () => {
          label.textContent = `Page ${currentPage} / ${totalPages}`;
          input.value = currentPage;
        };
        update();
        const changePage = async (target) => {
          const p = Math.min(totalPages, Math.max(1, target));
          if (p === currentPage) return;
          currentPage = p;
          calibrationPoints = [];
          calibration = null;
          tracePoints = [];
          closedPolygon = null;
          mode = "calibrating";
          document.getElementById("confirmCalibration").disabled = true;
          document.getElementById("calibrateControls").style.display = "flex";
          document.getElementById("startTraceControls").style.display = "none";
          document.getElementById("traceControls").style.display = "none";
          document.getElementById("saveControls").style.display = "none";
          ["step1", "step2", "step3"].forEach((id) => {
            document.getElementById(id).classList.remove("active", "done");
          });
          document.getElementById("step1").classList.add("active");
          setResult(`Rendering page ${p}…`);
          await renderPdfPage(p);
          setResult("");
          update();
          const url = new URL(location.href);
          url.searchParams.set("page", String(p));
          history.replaceState(null, "", url);
        };
        document.getElementById("prevPage").addEventListener("click", () => changePage(currentPage - 1));
        document.getElementById("nextPage").addEventListener("click", () => changePage(currentPage + 1));
        document.getElementById("goPage").addEventListener("click", () => changePage(parseInt(input.value, 10) || currentPage));
      }

      function afterSourceLoaded() {
        document.getElementById("calibrateControls").style.display = "flex";
        document.getElementById("step1").classList.add("active");
        mode = "calibrating";
        canvas.addEventListener("click", onCanvasClick);
      }

      function redraw() {
        ctx.putImageData(sourceImage, 0, 0);

        if (calibrationPoints.length > 0) {
          ctx.strokeStyle = "#2563eb";
          ctx.fillStyle = "#2563eb";
          ctx.lineWidth = 2;
          ctx.beginPath();
          calibrationPoints.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
          ctx.stroke();
          calibrationPoints.forEach((p) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
          });
        }
        if (calibration && calibrationPoints.length === 2) {
          const mid = midpoint(calibrationPoints[0], calibrationPoints[1]);
          ctx.fillStyle = "#2563eb";
          ctx.font = "14px sans-serif";
          ctx.fillText(`${calibration.realDistance} ${calibration.unit}`, mid.x + 6, mid.y - 6);
        }

        const pts = closedPolygon || tracePoints;
        if (pts.length > 0) {
          ctx.strokeStyle = "#16a34a";
          ctx.fillStyle = "rgba(22,163,74,0.25)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          pts.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
          if (closedPolygon) ctx.closePath();
          if (closedPolygon) ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#16a34a";
          pts.forEach((p) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
          });
        }
      }

      function midpoint(a, b) {
        return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      }

      function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function canvasPoint(evt) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: ((evt.clientX - rect.left) / rect.width) * canvas.width,
          y: ((evt.clientY - rect.top) / rect.height) * canvas.height,
        };
      }

      function onCanvasClick(evt) {
        const p = canvasPoint(evt);
        if (mode === "calibrating") {
          if (calibrationPoints.length >= 2) calibrationPoints = [];
          calibrationPoints.push(p);
          redraw();
          document.getElementById("confirmCalibration").disabled = calibrationPoints.length !== 2;
        } else if (mode === "tracing") {
          tracePoints.push(p);
          redraw();
          document.getElementById("closeShape").disabled = tracePoints.length < 3;
          document.getElementById("undoPoint").disabled = tracePoints.length === 0;
        }
      }

      document.getElementById("resetCalibration").addEventListener("click", () => {
        calibrationPoints = [];
        calibration = null;
        document.getElementById("confirmCalibration").disabled = true;
        redraw();
      });

      document.getElementById("confirmCalibration").addEventListener("click", () => {
        const realDistance = parseFloat(document.getElementById("realDistance").value);
        const unit = document.getElementById("realUnit").value;
        if (!realDistance || realDistance <= 0) {
          fail("Enter the real-world distance for the calibration line first.");
          return;
        }
        calibration = {
          pixelDistance: dist(calibrationPoints[0], calibrationPoints[1]),
          realDistance,
          unit,
        };
        document.getElementById("step1").classList.remove("active");
        document.getElementById("step1").classList.add("done");
        document.getElementById("calibrateControls").style.display = "none";
        document.getElementById("startTraceControls").style.display = "flex";
        mode = "idle";
        setResult("");
        redraw();
      });

      document.getElementById("startTrace").addEventListener("click", () => {
        mode = "tracing";
        tracePoints = [];
        closedPolygon = null;
        document.getElementById("closeShape").disabled = true;
        document.getElementById("undoPoint").disabled = true;
        document.getElementById("step2").classList.add("active");
        document.getElementById("startTraceControls").style.display = "none";
        document.getElementById("traceControls").style.display = "flex";
        document.getElementById("saveControls").style.display = "none";
        redraw();
      });

      document.getElementById("undoPoint").addEventListener("click", () => {
        if (closedPolygon || tracePoints.length === 0) return;
        tracePoints.pop();
        document.getElementById("closeShape").disabled = tracePoints.length < 3;
        document.getElementById("undoPoint").disabled = tracePoints.length === 0;
        redraw();
      });

      document.getElementById("resetTrace").addEventListener("click", () => {
        tracePoints = [];
        closedPolygon = null;
        document.getElementById("closeShape").disabled = true;
        document.getElementById("undoPoint").disabled = true;
        document.getElementById("saveControls").style.display = "none";
        redraw();
      });

      document.getElementById("closeShape").addEventListener("click", () => {
        if (tracePoints.length < 3) return;
        closedPolygon = tracePoints.slice();
        mode = "idle";
        document.getElementById("step2").classList.remove("active");
        document.getElementById("step2").classList.add("done");
        document.getElementById("step3").classList.add("active");
        document.getElementById("traceControls").style.display = "none";
        document.getElementById("saveControls").style.display = "flex";
        redraw();
        showAreaPreview();
      });

      function polygonAreaPixels(points) {
        let sum = 0;
        for (let i = 0; i < points.length; i++) {
          const a = points[i];
          const b = points[(i + 1) % points.length];
          sum += a.x * b.y - b.x * a.y;
        }
        return Math.abs(sum) / 2;
      }

      function showAreaPreview() {
        const feetPerUnit = calibration.unit === "in" ? 1 / 12 : 1;
        const feetPerPixel = (calibration.realDistance * feetPerUnit) / calibration.pixelDistance;
        const areaSqFt = polygonAreaPixels(closedPolygon) * feetPerPixel * feetPerPixel;
        document.getElementById("areaSummary").textContent = `≈ ${areaSqFt.toFixed(1)} sq ft (server will recompute and score confidence)`;
      }

      document.getElementById("saveTakeoff").addEventListener("click", async () => {
        if (!calibration || !closedPolygon) return;
        redraw();
        const markupImage = canvas.toDataURL("image/png");
        const payload = {
          fileName,
          pageNumber: currentPage,
          quantityType: "square_footage",
          scale: calibration,
          polygon: closedPolygon,
          markupImage,
          canvasWidth: canvas.width,
          canvasHeight: canvas.height,
          note: document.getElementById("note").value || null,
        };
        setResult("Saving…");
        try {
          const res = await fetch("/api/takeoffs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const body = await res.json();
          if (!res.ok) {
            fail(`Error: ${body.error || res.statusText}`);
            return;
          }
          renderSaved(body);
        } catch (e) {
          fail(`Network error: ${e.message}`);
        }
      });

      function renderSaved(record) {
        const cls = record.confidence === "medium" ? "ok" : "warn";
        setResult(
          `Saved takeoff ${record.id}\n` +
            `Value: ${record.value} ${record.unit}\n` +
            `Confidence: ${record.confidence}\n` +
            record.confidenceReasons.map((r) => `  - ${r}`).join("\n") +
            `\nMarkup proof: /uploads/markups/${record.markupFileName}\n\n` +
            `If this number is wrong, correct it below.`,
          cls
        );
        showCorrectionForm(record);
      }

      function showCorrectionForm(record) {
        const wrap = document.createElement("div");
        wrap.className = "controls";
        wrap.innerHTML = `
          <span>Correction:</span>
          <input type="number" id="correctedValue" placeholder="correct value" step="0.01" style="width:8rem" />
          <input type="text" id="correctionNote" placeholder="why" style="flex:1;min-width:10rem" />
          <button id="submitCorrection">Submit correction</button>
        `;
        resultEl.after(wrap);
        wrap.querySelector("#submitCorrection").addEventListener("click", async () => {
          const correctedValue = parseFloat(wrap.querySelector("#correctedValue").value);
          const note = wrap.querySelector("#correctionNote").value;
          if (!Number.isFinite(correctedValue)) return;
          const res = await fetch(`/api/takeoffs/${record.id}/corrections`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ correctedValue, note }),
          });
          if (res.ok) {
            wrap.innerHTML = "<span>Correction logged. Thank you.</span>";
          }
        });
      }
    </script>
  </body>
</html>
