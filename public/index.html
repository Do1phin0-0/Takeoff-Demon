<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Takeoff-Demon — Upload</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      h1 { margin-bottom: 0.25rem; }
      .hint { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
      form { display: flex; flex-direction: column; gap: 1rem; }
      input[type="file"] { padding: 0.5rem; border: 1px dashed #888; border-radius: 6px; }
      button { padding: 0.6rem 1rem; font-size: 1rem; cursor: pointer; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      #result { margin-top: 1.5rem; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.85rem; }
      .ok { color: #1a7f37; }
      .err { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>Takeoff-Demon</h1>
    <p class="hint">
      Upload blueprints or photos. Accepts PDF, PNG, JPG, WebP, TIFF, DWG, DXF.
      Max 100 MB per file, up to 20 files at once.
    </p>
    <form id="form">
      <input
        id="files"
        name="files"
        type="file"
        multiple
        accept=".pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff,.dwg,.dxf,application/pdf,image/*"
        required
      />
      <button type="submit" id="submit">Upload</button>
    </form>
    <div id="result"></div>
    <script>
      const form = document.getElementById("form");
      const submit = document.getElementById("submit");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("files");
        if (!input.files.length) return;

        const data = new FormData();
        for (const f of input.files) data.append("files", f);

        submit.disabled = true;
        result.textContent = "Uploading...";
        result.className = "";
        try {
          const res = await fetch("/upload", { method: "POST", body: data });
          const body = await res.json();
          if (!res.ok) {
            result.className = "err";
            result.textContent = `Error: ${body.error || res.statusText}`;
          } else {
            result.className = "ok";
            result.textContent =
              `Uploaded ${body.uploaded.length} file(s):\n` +
              body.uploaded
                .map(
                  (f) =>
                    `  ${f.originalName}  (${(f.size / 1024 / 1024).toFixed(2)} MB)`
                )
                .join("\n");
          }
        } catch (err) {
          result.className = "err";
          result.textContent = `Network error: ${err.message}`;
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
