<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Takeoff-Demon — Upload</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      h1 { margin-bottom: 0.25rem; }
      .hint { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
      form { display: flex; flex-direction: column; gap: 1rem; }
      input[type="file"] { padding: 0.5rem; border: 1px dashed #888; border-radius: 6px; }
      button { padding: 0.6rem 1rem; font-size: 1rem; cursor: pointer; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      #result { margin-top: 1.5rem; }
      .err { color: #b91c1c; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.85rem; }
      .file-card { border: 1px solid #444; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
      .file-card h3 { margin: 0 0 0.5rem; font-size: 1rem; }
      .file-meta { color: #666; font-size: 0.8rem; margin-bottom: 0.75rem; }
      .analysis { white-space: pre-wrap; font-size: 0.9rem; }
      .analysis.skipped, .analysis.error { color: #b45309; font-style: italic; }
    </style>
  </head>
  <body>
    <h1>Takeoff-Demon</h1>
    <p class="hint">
      Upload blueprints or photos. Accepts PDF, PNG, JPG, WebP, TIFF, DWG, DXF.
      Max 100 MB per file, up to 20 files at once.
      PDF, PNG, JPG, and WebP files under 30 MB get an automatic AI takeoff summary.
    </p>
    <form id="form">
      <input
        id="files"
        name="files"
        type="file"
        multiple
        accept=".pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff,.dwg,.dxf,application/pdf,image/*"
        required
      />
      <button type="submit" id="submit">Upload</button>
    </form>
    <div id="result"></div>
    <script>
      const form = document.getElementById("form");
      const submit = document.getElementById("submit");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("files");
        if (!input.files.length) return;

        const data = new FormData();
        for (const f of input.files) data.append("files", f);

        submit.disabled = true;
        result.className = "";
        result.textContent = "Uploading and analyzing...";
        try {
          const res = await fetch("/upload", { method: "POST", body: data });
          const body = await res.json();
          if (!res.ok) {
            result.className = "err";
            result.textContent = `Error: ${body.error || res.statusText}`;
          } else {
            result.innerHTML = "";
            for (const f of body.uploaded) {
              const card = document.createElement("div");
              card.className = "file-card";

              const title = document.createElement("h3");
              title.textContent = f.originalName;
              card.appendChild(title);

              const meta = document.createElement("div");
              meta.className = "file-meta";
              meta.textContent = `${(f.size / 1024 / 1024).toFixed(2)} MB`;
              card.appendChild(meta);

              const analysis = document.createElement("div");
              if (f.analysis.status === "ok") {
                analysis.className = "analysis";
                analysis.textContent = f.analysis.text;
              } else {
                analysis.className = `analysis ${f.analysis.status}`;
                analysis.textContent = f.analysis.reason;
              }
              card.appendChild(analysis);

              result.appendChild(card);
            }
          }
        } catch (err) {
          result.className = "err";
          result.textContent = `Network error: ${err.message}`;
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
