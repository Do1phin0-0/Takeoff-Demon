<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Takeoff-Demon — Blueprint Analyzer</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --border: #d1d5db;
        --bg-drop: #f9fafb;
        --text-muted: #6b7280;
        --success: #15803d;
        --error: #b91c1c;
        --warning: #92400e;
      }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 { margin-bottom: 0.2rem; }
      .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.75rem; }

      /* Drop zone */
      #drop-zone {
        border: 2px dashed var(--border);
        border-radius: 10px;
        background: var(--bg-drop);
        padding: 2rem;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
        margin-bottom: 1rem;
      }
      #drop-zone.drag-over {
        border-color: var(--accent);
        background: #eff6ff;
      }
      #drop-zone p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }
      #drop-zone strong { display: block; margin-bottom: 0.4rem; }
      #file-input { display: none; }

      /* File list */
      #file-list { list-style: none; padding: 0; margin: 0 0 1rem; display: flex; flex-direction: column; gap: 0.4rem; }
      #file-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 0.875rem;
      }
      #file-list li .fname { font-weight: 500; word-break: break-all; }
      #file-list li .fsize { color: var(--text-muted); white-space: nowrap; margin-left: 0.75rem; }
      #file-list li button {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--error);
        font-size: 1rem;
        padding: 0 0.25rem;
        line-height: 1;
        flex-shrink: 0;
      }

      /* Notes */
      textarea {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.9rem;
        resize: vertical;
        margin-bottom: 1rem;
      }
      label { display: block; font-weight: 500; margin-bottom: 0.3rem; font-size: 0.9rem; }

      /* Buttons */
      .btn-row { display: flex; gap: 0.75rem; }
      button.primary {
        padding: 0.6rem 1.25rem;
        font-size: 1rem;
        cursor: pointer;
        border-radius: 6px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-weight: 500;
      }
      button.primary:hover:not(:disabled) { background: var(--accent-hover); }
      button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
      button.secondary {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
      }
      button.secondary:hover:not(:disabled) { background: #f3f4f6; }

      /* Status bar */
      #status { margin-top: 1rem; font-size: 0.85rem; min-height: 1.25rem; }
      #status.ok { color: var(--success); }
      #status.err { color: var(--error); }
      #status.warn { color: var(--warning); }

      /* Analysis output */
      #analysis-section { margin-top: 1.75rem; display: none; }
      #analysis-section h2 { margin-bottom: 0.75rem; font-size: 1.1rem; }
      #analysis-output {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.25rem 1.5rem;
        font-size: 0.9rem;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 4rem;
        background: var(--bg-drop);
        font-family: inherit;
        line-height: 1.6;
      }

      /* Markdown-rendered output */
      #analysis-output h1, #analysis-output h2, #analysis-output h3 {
        margin: 1rem 0 0.3rem;
      }
      #analysis-output h1 { font-size: 1.2rem; }
      #analysis-output h2 { font-size: 1.05rem; border-bottom: 1px solid var(--border); padding-bottom: 0.2rem; }
      #analysis-output h3 { font-size: 0.95rem; }
      #analysis-output ul, #analysis-output ol { padding-left: 1.5rem; margin: 0.3rem 0; }
      #analysis-output li { margin-bottom: 0.15rem; }
      #analysis-output table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; font-size: 0.85rem; }
      #analysis-output th, #analysis-output td { border: 1px solid var(--border); padding: 0.35rem 0.6rem; text-align: left; }
      #analysis-output th { background: #e5e7eb; }
      #analysis-output strong { font-weight: 600; }
      #analysis-output em { font-style: italic; }
      #analysis-output code { background: #e5e7eb; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.82rem; font-family: ui-monospace, monospace; }
      #analysis-output blockquote { border-left: 3px solid var(--border); margin: 0.5rem 0; padding: 0.25rem 0.75rem; color: var(--text-muted); }

      .spinner { display: inline-block; width: 0.8em; height: 0.8em; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 0.4rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <h1>Takeoff-Demon</h1>
    <p class="subtitle">Upload blueprints or photos &mdash; Claude will perform a full construction takeoff and cost estimate.</p>

    <div id="drop-zone" role="button" tabindex="0" aria-label="Drop files here or click to select">
      <strong>Drop files here</strong>
      <p>or click to browse &mdash; PDF, PNG, JPG, WebP, TIFF, DWG, DXF &bull; Max 100 MB each, up to 20 files</p>
    </div>
    <input id="file-input" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff,.dwg,.dxf,application/pdf,image/*" />

    <ul id="file-list"></ul>

    <label for="notes">Additional notes (optional)</label>
    <textarea id="notes" rows="3" placeholder="E.g. 'This is a remodel — keep existing foundation.' or 'Estimate for Texas market, union labor.'"></textarea>

    <div class="btn-row">
      <button class="primary" id="analyze-btn" disabled>Analyze Blueprints</button>
      <button class="secondary" id="clear-btn">Clear</button>
    </div>

    <div id="status"></div>

    <div id="analysis-section">
      <h2>Analysis</h2>
      <div id="analysis-output"></div>
    </div>

    <script>
      const dropZone = document.getElementById("drop-zone");
      const fileInput = document.getElementById("file-input");
      const fileListEl = document.getElementById("file-list");
      const notesEl = document.getElementById("notes");
      const analyzeBtn = document.getElementById("analyze-btn");
      const clearBtn = document.getElementById("clear-btn");
      const statusEl = document.getElementById("status");
      const analysisSection = document.getElementById("analysis-section");
      const analysisOutput = document.getElementById("analysis-output");

      // Stored uploaded file entries: { originalName, storedName, size }
      let uploadedFiles = [];
      // DataTransfer list for selected-but-not-yet-uploaded files
      let pendingFiles = [];

      /* ---- Markdown renderer (minimal, no external deps) ---- */
      function parseMarkdown(md) {
        let html = md
          // Headings
          .replace(/^### (.+)$/gm, "<h3>$1</h3>")
          .replace(/^## (.+)$/gm, "<h2>$1</h2>")
          .replace(/^# (.+)$/gm, "<h1>$1</h1>")
          // Bold / italic
          .replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>")
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.+?)\*/g, "<em>$1</em>")
          // Inline code
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          // Blockquote
          .replace(/^> (.+)$/gm, "<blockquote>$1</blockquote>")
          // Unordered list items
          .replace(/^[-*] (.+)$/gm, "<li>$1</li>")
          // Ordered list items
          .replace(/^\d+\. (.+)$/gm, "<li>$1</li>")
          // Horizontal rule
          .replace(/^---$/gm, "<hr>")
          // Double newline → paragraph break
          .replace(/\n{2,}/g, "\n\n");

        // Wrap consecutive <li> in <ul>
        html = html.replace(/(<li>.*<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`);

        // Simple table: | col | col |
        html = html.replace(/((?:^\|.+\|\n?)+)/gm, (block) => {
          const rows = block.trim().split("\n").filter(r => r.trim());
          let table = "<table>";
          rows.forEach((row, i) => {
            if (/^\|[-| :]+\|$/.test(row.trim())) return; // separator row
            const cells = row.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
            const tag = i === 0 ? "th" : "td";
            table += "<tr>" + cells.map(c => `<${tag}>${c}</${tag}>`).join("") + "</tr>";
          });
          return table + "</table>";
        });

        return html;
      }

      /* ---- File list UI ---- */
      function renderFileList() {
        fileListEl.innerHTML = "";
        uploadedFiles.forEach((f, i) => {
          const li = document.createElement("li");
          li.innerHTML = `
            <span class="fname">${escHtml(f.originalName)}</span>
            <span class="fsize">${(f.size / 1024 / 1024).toFixed(2)} MB</span>
            <button title="Remove" data-i="${i}">&times;</button>
          `;
          fileListEl.appendChild(li);
        });
        analyzeBtn.disabled = uploadedFiles.length === 0;
      }

      fileListEl.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-i]");
        if (!btn) return;
        uploadedFiles.splice(Number(btn.dataset.i), 1);
        renderFileList();
      });

      function escHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      /* ---- Drop zone ---- */
      dropZone.addEventListener("click", () => fileInput.click());
      dropZone.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });

      dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("drag-over"); });
      dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("drag-over");
        handleFileSelection([...e.dataTransfer.files]);
      });

      fileInput.addEventListener("change", () => {
        handleFileSelection([...fileInput.files]);
        fileInput.value = "";
      });

      async function handleFileSelection(files) {
        if (!files.length) return;
        setStatus("Uploading...", "");
        analyzeBtn.disabled = true;

        const data = new FormData();
        files.forEach(f => data.append("files", f));

        try {
          const res = await fetch("/upload", { method: "POST", body: data });
          const body = await res.json();
          if (!res.ok) {
            setStatus(`Upload error: ${body.error || res.statusText}`, "err");
            return;
          }
          uploadedFiles.push(...body.uploaded);
          renderFileList();
          setStatus(`${body.uploaded.length} file(s) uploaded.`, "ok");
        } catch (err) {
          setStatus(`Network error: ${err.message}`, "err");
        }
      }

      /* ---- Clear ---- */
      clearBtn.addEventListener("click", () => {
        uploadedFiles = [];
        renderFileList();
        notesEl.value = "";
        statusEl.textContent = "";
        statusEl.className = "";
        analysisSection.style.display = "none";
        analysisOutput.innerHTML = "";
      });

      /* ---- Status helper ---- */
      function setStatus(msg, cls) {
        statusEl.textContent = msg;
        statusEl.className = cls;
      }

      /* ---- Analyze ---- */
      analyzeBtn.addEventListener("click", async () => {
        if (!uploadedFiles.length) return;

        analyzeBtn.disabled = true;
        clearBtn.disabled = true;
        setStatus("", "");
        analysisSection.style.display = "block";
        analysisOutput.innerHTML = '<span class="spinner"></span> Analyzing blueprints…';

        let rawText = "";

        try {
          const res = await fetch("/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              files: uploadedFiles.map(f => f.storedName),
              notes: notesEl.value,
            }),
          });

          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            analysisOutput.innerHTML = `<span style="color:var(--error)">Error: ${escHtml(body.error || res.statusText)}</span>`;
            return;
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = "";

          analysisOutput.innerHTML = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });

            const lines = buf.split("\n");
            buf = lines.pop(); // keep incomplete line

            for (const line of lines) {
              if (!line.startsWith("data: ")) continue;
              const payload = line.slice(6).trim();
              if (payload === "[DONE]") break;
              try {
                const msg = JSON.parse(payload);
                if (msg.error) {
                  analysisOutput.innerHTML += `<span style="color:var(--error)">${escHtml(msg.error)}</span>`;
                } else if (msg.warning) {
                  analysisOutput.innerHTML += `<span style="color:var(--warning)">${escHtml(msg.warning)}\n</span>`;
                } else if (msg.text) {
                  rawText += msg.text;
                  analysisOutput.innerHTML = parseMarkdown(rawText);
                }
              } catch (_) {}
            }
          }

          setStatus("Analysis complete.", "ok");
        } catch (err) {
          analysisOutput.innerHTML = `<span style="color:var(--error)">Network error: ${escHtml(err.message)}</span>`;
        } finally {
          analyzeBtn.disabled = false;
          clearBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
