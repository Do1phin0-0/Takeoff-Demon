services:
  - type: web
    name: takeoff-demon
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
